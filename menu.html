<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Bots Menu</title>

    <link rel="stylesheet" href="styles.css">

    <style>

        body{
            background:#000;
            margin:0;
            padding:30px 15px;
            font-family:Arial,sans-serif;
            color:white;
        }

        .menu-container{
            max-width:900px;
            margin:auto;
        }

        h1{
            text-align:center;
            margin-bottom:10px;
            color:#FFD54A;
        }

        p{
            text-align:center;
            color:#cfcfcf;
            margin-bottom:35px;
        }

        .menu-image{
            width:100%;
            border-radius:18px;
            display:block;
            margin-bottom:35px;

            box-shadow:0 15px 35px rgba(0,0,0,.45);
        }

    </style>

</head>

<body>

<div class="menu-container">

<img src="menu1.jpg" class="menu-image" alt="T-Bots Menu Page 1">

<img src="menu2.jpg" class="menu-image" alt="T-Bots Menu Page 2">

</div>

</body>
</html>
