<header class="main-header">

    <img
        src="logo.png"
        alt="T-Bots Street Food"
        class="logo"
    >

    <h1>T-Bots Street Food</h1>

    <p class="tagline">
        Fresh Food. Made to Order.
    </p>

    <div class="business-hours">
        <strong>Monday – Saturday</strong>
        <span>2:00 PM – 11:00 PM</span>
    </div>

    <p class="menu-description">
        Tacos • Burgers • Burritos<br>
        Hot Dogs • Wings
    </p>

</header>

<div class="button-list">

    <a href="#" class="action-button featured-button">

        <span class="icon-container">
            <i class="fa-solid fa-utensils"></i>
        </span>

        <span class="button-content">
            <strong>View Menu</strong>
            <small>Explore our food and prices</small>
        </span>

        <i class="fa-solid fa-chevron-right button-arrow"></i>

    </a>

    <a
        href="https://www.instagram.com/tbotsatl/"
        target="_blank"
        rel="noopener noreferrer"
        class="action-button"
    >

        <span class="icon-container">
            <i class="fa-brands fa-instagram"></i>
        </span>

        <span class="button-content">
            <strong>Follow Us on Instagram</strong>
            <small>See our latest food photos</small>
        </span>

        <i class="fa-solid fa-arrow-up-right-from-square button-arrow"></i>

    </a>

</div>

<div class="location-heading">

    <p>Find T-Bots Near You</p>

    <h2>Choose Your Location</h2>

</div>

<div class="button-list">

    <button
        type="button"
        class="action-button"
        onclick="showPage('riverdale')"
    >
        <span class="icon-container">
            <i class="fa-solid fa-location-dot"></i>
        </span>

        <span class="button-content">
            <strong>Riverdale</strong>
            <small>199 Upper Riverdale Road</small>
        </span>

        <i class="fa-solid fa-chevron-right button-arrow"></i>
    </button>

    <button
        type="button"
        class="action-button"
        onclick="showPage('ellenwood')"
    >
        <span class="icon-container">
            <i class="fa-solid fa-location-dot"></i>
        </span>

        <span class="button-content">
            <strong>Ellenwood</strong>
            <small>795 Fairview Road</small>
        </span>

        <i class="fa-solid fa-chevron-right button-arrow"></i>
    </button>

    <button
        type="button"
        class="action-button"
        onclick="showPage('morrow')"
    >
        <span class="icon-container">
            <i class="fa-solid fa-location-dot"></i>
        </span>

        <span class="button-content">
            <strong>Morrow</strong>
            <small>1186 Morrow Road</small>
        </span>

        <i class="fa-solid fa-chevron-right button-arrow"></i>
    </button>

    <button
        type="button"
        class="action-button"
        onclick="showPage('college-park')"
    >
        <span class="icon-container">
            <i class="fa-solid fa-location-dot"></i>
        </span>

        <span class="button-content">
            <strong>College Park</strong>
            <small>2511 Camp Creek Parkway</small>
        </span>

        <i class="fa-solid fa-chevron-right button-arrow"></i>
    </button>

</div>
